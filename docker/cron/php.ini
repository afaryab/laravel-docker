[PHP]
; Maximum memory limit for PHP scripts (increased for large reports)
memory_limit = 2048M

; Maximum execution time for scripts (in seconds)
max_execution_time = 900

; Maximum input time for scripts (in seconds)
max_input_time = 900

; Maximum size of POST data
post_max_size = 200M

; Maximum upload file size
upload_max_filesize = 200M

; Error reporting
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = Asia/Kabul

; Session configuration
session.gc_maxlifetime = 3600

; Realpath cache for better performance
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache settings for better performance
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.enable_cli = 0
