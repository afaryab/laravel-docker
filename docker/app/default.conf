server {
    listen 80;
    server_name default;
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Increase buffer sizes to handle large headers
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;
    fastcgi_busy_buffers_size 32k;
    
    # Also increase proxy buffer sizes for good measure
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 32k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_pass_request_headers on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REQUESTED_WITH $http_x_requested_with;
        fastcgi_param HTTP_X_INERTIA $http_x_inertia;
        fastcgi_param HTTP_X_INERTIA_VERSION $http_x_inertia_version;
        fastcgi_param HTTP_X_INERTIA_PARTIAL_COMPONENT $http_x_inertia_partial_component;
        fastcgi_param HTTP_X_INERTIA_PARTIAL_DATA $http_x_inertia_partial_data;
        fastcgi_param HTTP_X_INERTIA_PARTIAL_EXCEPT $http_x_inertia_partial_except;
        fastcgi_param HTTP_X_INERTIA_RESET $http_x_inertia_reset;
        fastcgi_param HTTP_X_INERTIA_ERROR_BAG $http_x_inertia_error_bag;
        fastcgi_read_timeout 300;
        
        # Override fastcgi buffer settings for PHP requests
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:env|ini|log)$ { deny all; }
    location ~* \.(?:git|svn|hg)$ { deny all; }

    client_max_body_size 64m;
}
