server {
    listen 80;
    server_name default;
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Increase buffer sizes to handle large headers
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;
    fastcgi_busy_buffers_size 32k;
    
    # Also increase proxy buffer sizes for good measure
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 32k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Pass original scheme info coming from proxies
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;

        fastcgi_pass 127.0.0.1:9000;
        
        fastcgi_read_timeout 300;
        
        # Override fastcgi buffer settings for PHP requests
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:env|ini|log)$ { deny all; }
    location ~* \.(?:git|svn|hg)$ { deny all; }

    client_max_body_size 64m;
}
